# A generic, single database configuration for Alembic.

[alembic]
# Path to migration environment scripts
script_location = alembic

# Revision file template naming convention
file_template = %%(rev)s_%%(slug)s

# Sys path prepend for module discovery
prepend_sys_path = .

# Timezone for revision timestamps (optional)
# timezone = UTC

# Delimiter for multiple version locations
version_path_separator = os
path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
